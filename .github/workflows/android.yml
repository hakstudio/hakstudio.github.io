name: Android derle
on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Model ve onnxruntime dosyaları sitedeki EMA klasöründen alınır (aynı dosyaları iki kez tutmamak için)
      - uses: actions/checkout@v5
        with:
          ref: main
          path: site
          sparse-checkout: |
            yaz-konustur/ema/model

      - name: Model dosyalarını uygulamaya kopyala
        run: |
          # Uygulamada ses yerel ONNX Runtime ile üretilir, tarayıcı sürümündeki wasm (ort/) gerekmez
          rm -rf app/src/main/assets/www/model app/src/main/assets/www/ort
          cp -r site/yaz-konustur/ema/model app/src/main/assets/www/model
          du -sh app/src/main/assets/www

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Derle
        run: gradle --no-daemon assembleDebug bundleRelease

      - name: Çıktıları taslak sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/yaz-konustur-deneme.apk
          cp app/build/outputs/bundle/release/app-release.aab out/yaz-konustur-imzasiz.aab
          ls -la out
          gh release delete android-build -y --cleanup-tag 2>/dev/null || true
          gh release create android-build --draft --target "$GITHUB_SHA" --title "Android derlemesi ${GITHUB_SHA::7}" --notes "Otomatik derleme" out/*

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/yaz-konustur-deneme.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde dene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: ./ci/smoke.sh
      - name: Sonuçları yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd smoke && tar czf ../smoke.tgz . && cd ..
          gh release upload android-build smoke.tgz smoke/1-acilis.png smoke/2-paylasim.png --clobber
